# Table 7: batch 8, accumulation 16; released launcher uses one process.
# T4 x2: 4 per GPU * 2 GPUs * 16 accumulation = 128 forget examples.
defaults:
  - forget_lora
  - _self_

model_family: llava-phi
model_path: gray311/vlm_unlearning_ft_llava_phi_3_mini
attn_implementation: sdpa
data_path: ./dataset/full.json
split: forget5
forget_loss: idk
lr: 3e-4
batch_size: 4
gradient_accumulation_steps: 16
num_epochs: 8
LoRA:
  r: 128
  alpha: 256
  dropout: 0.05
workers: 0
report_to: null
save_dir: /kaggle/working/models/llava_phi_PO_forget5
save_model: true
save_steps: 8
